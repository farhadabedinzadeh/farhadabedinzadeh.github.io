<article class="publication" data-topic="{{ paper.topic | escape }}">
  {% if include.thumbnail and paper.image %}<a class="publication-image" href="{{ paper.url }}" aria-label="Read {{ paper.title | escape }}"><img src="{{ paper.image | relative_url }}" alt="Figure from {{ paper.title | escape }}" width="240" height="160" loading="lazy" decoding="async"></a>{% endif %}
  <div class="publication-content">
    <div class="paper-meta"><span>{{ paper.topic }}</span><span>{{ paper.venue }} · {{ paper.year }}</span></div>
    <h3><a href="{{ paper.url }}">{{ paper.title }}</a></h3>
    <div class="authors">{{ paper.authors | markdownify }}</div>
    <p class="paper-summary">{{ paper.summary }}</p>
    <a class="text-link paper-link" href="{{ paper.url }}">{% if paper.url contains 'doi.org' %}Paper / DOI{% else %}Read paper{% endif %} <span aria-hidden="true">↗</span></a>
  </div>
</article>
