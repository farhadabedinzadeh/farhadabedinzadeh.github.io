name: Refresh Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  push:
    branches: [main, site-improvements]
    paths:
      - scripts/update_scholar_stats.py
      - .github/workflows/google_scholar_crawler.yaml

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4==4.13.5
      - name: Fetch public citation statistics
        run: python scripts/update_scholar_stats.py --output "$RUNNER_TEMP/scholar-results"
      - name: Check out existing statistics branch
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: citation-data
      - name: Save fresh statistics
        working-directory: citation-data
        run: |
          cp "$RUNNER_TEMP/scholar-results/gs_data.json" gs_data.json
          cp "$RUNNER_TEMP/scholar-results/gs_data_shieldsio.json" gs_data_shieldsio.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Google Scholar citation statistics"
            git push origin HEAD:google-scholar-stats
          fi
